<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SELCO Foundation - Livelihood | WhatsApp Prototype</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#dfe5e7}
body{display:flex;justify-content:center}
.phone{width:min(430px,100vw);height:100vh;background:#efeae2;display:flex;flex-direction:column;overflow:hidden;position:relative}
.header{height:76px;background:#f0f2f5;color:#111;display:flex;align-items:center;padding:8px 12px;gap:10px;flex:none;z-index:5}
.back{font-size:39px;font-weight:200;line-height:1;margin-right:4px}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.logo img{width:100%;height:100%;object-fit:cover}
.logo span{font-weight:800;color:#e51d25;font-size:18px}
.headtitle{font-size:clamp(16px,4.4vw,18px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{flex:1;overflow-y:auto;padding:16px 14px calc(95px + env(safe-area-inset-bottom));background:#efeae2}
.day{background:#e7ded5;color:#555;border-radius:18px;padding:7px 17px;width:max-content;margin:8px auto 16px;font-weight:700;font-size:13px}
.notice{background:#d9fdd3;color:#365c3d;border-radius:18px;padding:14px 18px;text-align:center;max-width:88%;margin:0 auto 14px;font-size:14px;line-height:1.45}
.msg{max-width:88%;padding:12px 14px;border-radius:10px;margin:8px 0;font-size:16px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.18);word-break:break-word;position:relative}
.bot{background:#fff;color:#222;border-top-left-radius:3px}
.user{background:#d9fdd3;color:#111;margin-left:auto;border-top-right-radius:3px}
.msg .time{font-size:10px;color:#777;float:right;margin:7px 0 -2px 10px}
.typing{background:#fff;color:#777;padding:10px 14px;border-radius:10px;border-top-left-radius:3px;width:max-content;font-size:14px;margin:8px 0;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.typing span{display:inline-block;width:6px;height:6px;background:#999;border-radius:50%;margin:0 2px;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.quick{width:88%;background:#252525;border-radius:0 0 12px 12px;overflow:hidden;margin:-8px 0 10px 0}
.quick button{width:100%;background:#fff;color:#222;border:0;border-top:1px solid #e5e5e5;padding:13px 12px;font-size:16px;text-align:center;cursor:pointer}
.quick button:hover{background:#f5f5f5}
.quick button:active{background:#eee}
.composer{position:absolute;bottom:0;left:0;right:0;background:#f0f2f5;padding:9px 9px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:6}
.plus{color:#111;font-size:33px;font-weight:200;width:36px;text-align:center}
.input{flex:1;background:#fff;border:1px solid #ddd;border-radius:25px;color:#222;padding:12px 16px;font-size:16px;outline:none}
.input::placeholder{color:#777}
.send{width:45px;height:45px;border:0;border-radius:50%;background:#128c7e;color:#fff;font-size:20px;cursor:pointer}
.fileinput{display:none}
.filelabel{width:34px;height:42px;display:flex;align-items:center;justify-content:center;color:#333;cursor:pointer}
.paperclip{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.restart{display:block;margin:12px auto 0;background:#128c7e;color:#fff;border:0;border-radius:20px;padding:10px 18px;font-size:14px}
.review-card{background:#fff;border-radius:10px;padding:12px;margin:8px 0;box-shadow:0 1px 2px rgba(0,0,0,.12);color:#222}
.review-row{padding:7px 0;border-bottom:1px solid #eee;font-size:14px;line-height:1.4}
.review-row:last-child{border-bottom:0}
.review-label{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.review-value{font-size:15px;word-break:break-word}
.review-image{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:7px}
.typing{opacity:.7;font-style:italic}
@media(min-width:600px){
  .phone{width:100%;max-width:none;box-shadow:none;border:0}
}
</style>
</head>

let lang="English", state="trigger", data={};

function t(){return L[lang]}
function now(){return new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
function add(text,who="bot",buttons=[]){
  const d=document.createElement("div");
  d.className="msg "+who;
  d.innerHTML=String(text).replace(/\n/g,"<br>")+"<span class='time'>"+now()+"</span>";
  chat.appendChild(d);
  if(buttons.length){
    const q=document.createElement("div");q.className="quick";
    buttons.forEach(([label,fn])=>{
      const b=document.createElement("button");b.textContent=label;b.onclick=fn;q.appendChild(b);
    });
    chat.appendChild(q);
  }
  chat.scrollTop=chat.scrollHeight;
}
function showTyping(){
  const d=document.createElement("div");
  d.className="typing";
  d.id="typing";
  d.innerHTML="<span></span><span></span><span></span>";
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}
function removeTyping(){
  const d=document.getElementById("typing");
  if(d)d.remove();
}
function botReply(text,buttons=[],delay=850){
  showTyping();
  setTimeout(()=>{removeTyping();add(text,"bot",buttons)},delay);
}
function userThenBot(userText,botText,buttons=[],delay=850){
  add(userText,"user");
  botReply(botText,buttons,delay);
}
function addDay(){add(t().day,"bot")}
function showLanguage(){
  const names=L.English.languages;
  add(L.English.language,"bot",names.map((display,i)=>[
    display,()=>selectLanguage(Object.keys(L)[i])
  ]));
}
function selectLanguage(code){
  lang=code; state="asset";
  const display=L[code].langName;
  add(display,"user");
  state="mobile";
  botReply(t().mobile,[],900);
  input.placeholder = "10-digit mobile number…";
}
function assetSubmitted(v){
  data.asset=v; state="issue"; add(v,"user");
  botReply(t().issue, t().types.map(x=>[x,()=>chooseIssue(x)]),850);
}
function chooseIssue(v){
  data.issue=v; state="description"; add(v,"user"); botReply(t().describe,[],850);
  input.placeholder="Type here…";
}
function descriptionSubmitted(v){
  data.description=v; state="media";
  add(v,"user");
  botReply(t().media,[[t().skip,()=>skipMedia()]],950);
}
function skipMedia(){
  data.media=t().skip; add(t().skip,"user"); review();
}
function handleFile(file){
  if(!file)return;
  data.media=file.name;
  add("📎 "+file.name,"user");
  if(file.type && file.type.startsWith("image/")){
    const reader=new FileReader();
    reader.onload=()=>{data.mediaDataUrl=reader.result; review();};
    reader.readAsDataURL(file);
  } else {
    review();
  }
}
function reviewCard(){
  const z=t();
  const card=document.createElement("div");
  card.className="review-card";

  const rows=[
    [z.reviewMobile || "Mobile Number", data.mobile],
    [z.reviewName || "Name", data.name || "—"],
    [z.assetLabel, data.asset],
    [z.issueLabel, data.issue],
    [z.descLabel, data.description]
  ];

  rows.forEach(([label,value])=>{
    const row=document.createElement("div");
    row.className="review-row";
    row.innerHTML="<div class='review-label'>"+label+"</div><div class='review-value'>"+
      String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+
      "</div>";
    card.appendChild(row);
  });

  const media=document.createElement("div");
  media.className="review-row";
  media.innerHTML="<div class='review-label'>"+z.mediaLabel+"</div>";
  if(data.mediaDataUrl){
    const img=document.createElement("img");
    img.className="review-image";
    img.src=data.mediaDataUrl;
    img.alt=z.mediaLabel;
    media.appendChild(img);
  } else {
    const v=document.createElement("div");
    v.className="review-value";
    v.textContent=data.media || z.skip;
    media.appendChild(v);
  }
  card.appendChild(media);
  chat.appendChild(card);
  chat.scrollTop=chat.scrollHeight;
}

function reviewButtons(){
  const z=t();
  const q=document.createElement("div");q.className="quick";
  [[z.yes,submit],[z.no,cancel]].forEach(([label,fn])=>{
    const b=document.createElement("button");b.textContent=label;b.onclick=fn;q.appendChild(b);
  });
  chat.appendChild(q);chat.scrollTop=chat.scrollHeight;
}
function review(){
  botReply(t().reviewHeading,[],650);
  setTimeout(()=>{
    reviewCard();
    const z=t();
    const instruction=document.createElement("div");
    instruction.className="msg bot";
    instruction.innerHTML=z.yesNo+"<span class='time'>"+now()+"</span>";
    chat.appendChild(instruction);
    reviewButtons();
    chat.scrollTop=chat.scrollHeight;
  },1100);
}
function submit(){
  const z=t(), id="TKT-"+new Date().getFullYear()+String(Math.floor(100000+Math.random()*900000));
  add(z.yes,"user");
  botReply(z.success+"\n"+z.ticket+"\n"+id+"\n\n"+z.follow,[],1000);
  state="done";
  const b=document.createElement("button");b.className="restart";b.textContent=z.retry;
  b.onclick=()=>location.reload();chat.appendChild(b);
}
function cancel(){
  add(t().no,"user");
  add(t().cancel);
  state="done";
}
function send(){
  const v=input.value.trim();if(!v)return;input.value="";

  // First message from the user (Hi, Hello, or any other message) triggers the bot.
  if(state==="trigger"){
    add(v,"user");
    state="language";
    botReply(t().welcome,[],900);
    setTimeout(()=>showLanguage(),1150);
    return;
  }

  if(state==="mobile"){
    const digits=v.replace(/\D/g,"");
    add(v,"user");
    if(/^\d{10}$/.test(digits)){
      data.mobile=digits;
      state="asset";
      botReply(t().asset,[],850);
      input.placeholder="Type the asset name…";
    } else {
      botReply(t().invalidMobile,[],700);
    }
  }
  else if(state==="asset") assetSubmitted(v);
  else if(state==="description") descriptionSubmitted(v);
  else if(state==="media"){
    if(v.toLowerCase()==="skip") skipMedia();
    else {data.media=v;add(v,"user");review();}
  } else if(state==="confirm"){
    if(v.toLowerCase()==="yes") submit();
    else if(v.toLowerCase()==="no") cancel();
    else add(t().yesNo);
  }
}
input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});

</script>
